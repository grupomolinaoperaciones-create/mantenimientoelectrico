  dys+=`<div class="${we?'we ':''}${ds==t?'td':''}">${DL[w]}<b>${dt.getDate()}</b></div>`}
 segs.forEach(x=>{mon+=`<span style="width:calc(var(--dw)*${x.n})">${x.n>=4?MES[x.m]+' '+x.y:''}</span>`});
 let h=`<div class="gi" style="--n:${n}"><div class="gh"><div class="gr"><div class="gl"><span>Orden / equipo</span><span>% avance</span></div><div class="gk" style="background:none"><div class="gmon">${mon}</div><div class="gdy">${dys}</div></div></div></div>`;
 g.groups.forEach(gr=>{h+=`<div class="gr gg"><div class="gl"><span>${esc(gr.s.n)}</span><span>${g.wavg(gr.rows,ef)}%</span></div><div class="gk"></div></div>`;
  gr.rows.forEach(o=>{const s=dd(GS,ost(o)),len=dd(ost(o),oen(o))+1,e=s+len,st=sit(o,t),x=esp(o,t),p=ef(o);
   const ctl=AD()?`<input id="p-${o.id}" type="number" min="0" max="100" step="5" value="${p}" ${o.st=='Completada'?'disabled title="Una orden completada vale 100%"':''} aria-label="Avance de ${o.folio}" onchange="setAv('${o.id}',this.value)">`:`<span class="ro">${p}%</span>`;
   const nmq=nm(db.eq,o.eq)!='—'?nm(db.eq,o.eq):gr.s.n;
   h+=`<div class="gr"><div class="gl"><div style="min-width:0"><div class="geq" title="${esc(nmq)}">${esc(nmq)}</div><div class="gsub"><b>${o.folio}</b> · ${esc(nm(db.tech,o.tech))}</div></div><div class="gpc">${ctl}<span class="gc ${st[1]}">${st[0]}</span></div></div>`+
   `<div class="gk">${wk}<div class="gb ${o.tipo}" ${EO()?`onclick="editOT('${o.id}')" style="cursor:pointer;`:'style="'}left:calc(var(--dw)*${s});width:calc(var(--dw)*${len})" title="${esc(o.folio+' · '+ost(o)+' a '+oen(o)+' · esperado '+x+'%')}"><div class="f" style="width:${p}%"></div>${ost(o)<=t?`<div class="x" style="left:calc(${x}% - 1px)"></div>`:''}</div><div class="gtx" style="left:min(calc(var(--dw)*${e} + 4px),calc(var(--dw)*${n} - 38px))">${p}%</div></div></div>`})});
 if(!g.rows.length)h+=`<div class="gr"><div class="gl" style="grid-template-columns:1fr">Sin órdenes con fechas en este periodo</div></div>`;
 const ti=dd(GS,t);if(ti>=0&&ti<n)h+=`<div class="gtd" style="left:calc(var(--lw) + var(--dw)*${ti} + var(--dw)/2 - 1px)"></div>`;
 h+='</div>';
 const chip=o=>`<div class="tg" style="display:inline-block;margin:3px;cursor:pointer" ${EO()?`onclick="editOT('${o.id}')"`:''}><b>${o.folio}</b> ${esc(nm(db.eq,o.eq)!='—'?nm(db.eq,o.eq):nm(db.sites,o.site))}</div>`;
 return bar('c',['tipo','site','tech','prio'],ctrls)+sx+leg+`<div class="gt" tabindex="0" aria-label="Diagrama de Gantt">${h}</div>
 <h3>Sin fecha asignada (esperando material)</h3><div class="card" style="padding:8px">${g.un.map(chip).join('')||'<span class="mu">No hay órdenes sin programar.</span>'}</div>
 <p class="mu">Azul = preventivo, naranja = correctivo. La parte oscura es lo realizado; la marca negra, lo que debería llevar a hoy. ${AD()?'Cambia el porcentaje en la casilla de cada orden.':'Solo el admin puede cambiar el porcentaje.'} Define inicio y fin en cada orden (Editar).</p>`}
/* Campos */
function editS(id){const o=id?db.sites.find(x=>x.id==id):{};modal(id?'Renombrar campo':'Nuevo campo',[{k:'n',l:'Nombre del campo',r:1}],o,v=>commit('sites',id,o,{n:v.n}))}
function vS(){return `<div class="bar">${AD()?'<button class="b1" onclick="editS()">+ Nuevo campo</button>':''}</div><div class="card"><table style="min-width:420px"><tr><th>Campo</th><th>Equipos</th><th>Órdenes</th><th></th></tr>`+db.sites.map(s=>`<tr><td><b>${esc(s.n)}</b></td><td>${db.eq.filter(e=>e.site==s.id).length}</td><td>${db.ot.filter(o=>o.site==s.id).length}</td><td style="white-space:nowrap">${AD()?`<button class="ic" onclick="editS('${s.id}')">Renombrar</button>`:''}${delBtn('s',s.id)}</td></tr>`).join('')+`</table></div>`}
/* Reportes */
function exData(){const rows=db.ot.filter(o=>filt(o,'o')).sort((a,b)=>a.folio.localeCompare(b.folio));
 return {head:['Folio','Tipo','Campo','Equipo','Técnico','Prioridad','Estado','Avance %','Fecha inicio','Fecha fin','Fecha cierre','Requisición','Orden de compra','Descripción'],
 body:rows.map(o=>[o.folio,o.tipo,nm(db.sites,o.site),nm(db.eq,o.eq),nm(db.tech,o.tech),o.prio||'',o.st,ef(o),o.fini||'',o.fprog||'',o.fcierre||'',o.req||'',o.oc||'',o.desc||''])}}
function exFilt(){const f=FL.o,p=[];if(f.tipo)p.push('Tipo: '+f.tipo);if(f.site)p.push('Campo: '+nm(db.sites,f.site));if(f.st)p.push('Estado: '+f.st);if(f.tech)p.push('Técnico: '+nm(db.tech,f.tech));if(f.prio)p.push('Prioridad: '+f.prio);if(f.d1)p.push('Desde: '+f.d1);if(f.d2)p.push('Hasta: '+f.d2);if(f.q)p.push('Búsqueda: '+f.q);return p.join('  -  ')||'Sin filtros (todas las órdenes)'}
function expX(){const d=exData();if(!d.body.length)return toast('No hay órdenes con esos filtros');if(!window.XLSX)return toast('No cargó la librería de Excel; revisa tu conexión');
 const ws=XLSX.utils.aoa_to_sheet([d.head].concat(d.body));ws['!cols']=[9,12,20,22,18,10,20,9,12,12,12,12,14,50].map(w=>({wch:w}));
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Órdenes');XLSX.writeFile(wb,'ordenes_mantenimiento_'+today()+'.xlsx')}
function expP(){const d=exData();if(!d.body.length)return toast('No hay órdenes con esos filtros');if(!window.jspdf)return toast('No cargó la librería de PDF; revisa tu conexión');
 const doc=new window.jspdf.jsPDF({orientation:'landscape',unit:'pt',format:'letter'});
 try{doc.addImage($('logo').src,'PNG',30,20,46,46)}catch(e){}
 doc.setFontSize(15);doc.text('Grupo Molina - Órdenes de mantenimiento eléctrico',88,38);
 doc.setFontSize(9);doc.text('Generado: '+today()+'   -   '+d.body.length+' órdenes',88,52);doc.text(doc.splitTextToSize(exFilt(),680),88,64);
 doc.autoTable({head:[d.head],body:d.body,startY:82,margin:{left:30,right:30},styles:{fontSize:7,cellPadding:3},headStyles:{fillColor:[31,111,235]},columnStyles:{13:{cellWidth:130}}});
 const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8);doc.text('Página '+i+' de '+n,720,590)}
 doc.save('ordenes_mantenimiento_'+today()+'.pdf')}
function exFiltC(){const f=FL.c,p=[];if(f.tipo)p.push('Tipo: '+f.tipo);if(f.site)p.push('Campo: '+nm(db.sites,f.site));if(f.tech)p.push('Técnico: '+nm(db.tech,f.tech));if(f.prio)p.push('Prioridad: '+f.prio);return p.join('  -  ')||'Sin filtros'}
function expGX(){const g=gCalc();if(!g.rows.length)return toast('No hay órdenes en ese periodo');if(!window.XLSX)return toast('No cargó la librería de Excel; revisa tu conexión');
 const days=[];for(let i=0;i<g.n;i++)days.push(addD(GS,i));
 const head=['Folio','Campo','Equipo','Técnico','Tipo','Prioridad','Estado','Inicio','Fin','Avance %','Esperado a hoy %','Situación'].concat(days.map(x=>(x==g.t?'▼':'')+x.slice(8)+'/'+x.slice(5,7)));
 const body=[];g.groups.forEach(gr=>gr.rows.forEach(o=>{const s=ost(o),len=dd(s,oen(o))+1,dn=Math.round(ef(o)*len/100);
  body.push([o.folio,gr.s.n,nm(db.eq,o.eq),nm(db.tech,o.tech),o.tipo,o.prio||'',o.st,s,oen(o),ef(o),esp(o,g.t),sit(o,g.t)[0]].concat(days.map(x=>{const k=dd(s,x);return k>=0&&k<len?(k<dn?'■':'□'):''})))}));
 const aoa=[['Grupo Molina - Cronograma de mantenimiento eléctrico'],['Periodo: '+GS+' a '+GE+'   -   Generado: '+g.t],['Filtros: '+exFiltC()],['Avance general: '+g.real+'%   -   Esperado a hoy: '+g.esp+'%   -   Atrasadas: '+g.late+'   -   Completadas: '+g.done],['■ día realizado    □ día programado pendiente    ▼ hoy'],[],head].concat(body);
 const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=[9,20,24,18,11,10,20,11,11,9,9,11].map(w=>({wch:w})).concat(days.map(()=>({wch:6})));
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Cronograma');
 if(g.un.length){const w2=XLSX.utils.aoa_to_sheet([['Folio','Campo','Equipo','Estado','Descripción']].concat(g.un.map(o=>[o.folio,nm(db.sites,o.site),nm(db.eq,o.eq),o.st,o.desc||''])));w2['!cols']=[9,22,24,22,50].map(w=>({wch:w}));XLSX.utils.book_append_sheet(wb,w2,'Sin fecha')}
 XLSX.writeFile(wb,'cronograma_mantenimiento_'+g.t+'.xlsx')}
function expGP(){const g=gCalc();if(!g.rows.length)return toast('No hay órdenes en ese periodo');if(!window.jspdf)return toast('No cargó la librería de PDF; revisa tu conexión');
 const doc=new window.jspdf.jsPDF({orientation:'landscape',unit:'pt',format:'letter'}),W=792,H=612,M=30,LW=225,TX=M+LW,TW=W-M-TX,dw=TW/g.n,RH=20;
 const C={p:[31,111,235],ps:[207,224,251],c:[217,104,11],cs:[248,220,194],td:[217,45,32],wk:[238,241,244],hd:[233,237,241],ln:[223,228,234],tx:[28,37,48],mu:[102,113,127]};
 const fill=c=>doc.setFillColor(c[0],c[1],c[2]),stroke=c=>doc.setDrawColor(c[0],c[1],c[2]),ink=c=>doc.setTextColor(c[0],c[1],c[2]);
 const days=[];for(let i=0;i<g.n;i++)days.push(addD(GS,i));
 let y=0,top=0;
 const head=first=>{let y0;
  if(first){try{doc.addImage($('logo').src,'PNG',M,16,40,40)}catch(e){}
   ink(C.tx);doc.setFont('helvetica','bold');doc.setFontSize(14);doc.text('Grupo Molina - Cronograma de mantenimiento eléctrico',M+50,30);
   doc.setFont('helvetica','normal');doc.setFontSize(8);ink(C.mu);doc.text(doc.splitTextToSize('Periodo: '+GS+' a '+GE+'   Generado: '+g.t+'   Filtros: '+exFiltC(),W-2*M-50)[0],M+50,43);
   ink(C.tx);doc.setFont('helvetica','bold');doc.setFontSize(9);doc.text('Avance real '+g.real+'%   |   Esperado a hoy '+g.esp+'%   |   '+g.rows.length+' órdenes   |   '+g.late+' atrasadas   |   '+g.done+' completadas',M,66);
   doc.setFont('helvetica','normal');doc.setFontSize(7);let lx=M;[[C.ps,'Programado preventivo'],[C.p,'Realizado preventivo'],[C.cs,'Programado correctivo'],[C.c,'Realizado correctivo'],[C.tx,'Esperado a hoy'],[C.td,'Hoy']].forEach(l=>{fill(l[0]);doc.rect(lx,73,l[1]=='Hoy'||l[1]=='Esperado a hoy'?2:14,7,'F');ink(C.mu);doc.text(l[1],lx+(l[1]=='Hoy'||l[1]=='Esperado a hoy'?5:18),79);lx+=doc.getTextWidth(l[1])+34});
   y0=88}else{ink(C.mu);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.text('Grupo Molina - Cronograma de mantenimiento eléctrico   ('+GS+' a '+GE+')',M,22);y0=30}
  fill(C.hd);doc.rect(M,y0,LW+TW,22,'F');ink(C.mu);doc.setFont('helvetica','bold');doc.setFontSize(7);doc.text('Orden / equipo',M+3,y0+14);doc.text('% avance',TX-6,y0+14,{align:'right'});
  let i0=0;for(let i=0;i<=g.n;i++){const m=i<g.n?pd(days[i]).getMonth():-1;if(i==g.n||(i>i0&&m!=pd(days[i0]).getMonth())){const wd=(i-i0)*dw;stroke(C.ln);doc.line(TX+i0*dw,y0,TX+i0*dw,y0+11);if(wd>45){ink(C.tx);doc.setFontSize(7);doc.text(MES[pd(days[i0]).getMonth()]+' '+pd(days[i0]).getFullYear(),TX+i0*dw+3,y0+8)}i0=i}}
  const st=Math.max(1,Math.ceil(10/dw));doc.setFont('helvetica','normal');doc.setFontSize(6);ink(C.tx);days.forEach((x,i)=>{if(i%st==0)doc.text(String(+x.slice(8)),TX+i*dw+dw/2,y0+19,{align:'center'})});
  return y0+22};
 const endPage=()=>{const ti=dd(GS,g.t);if(ti>=0&&ti<g.n){stroke(C.td);doc.setLineWidth(.8);const x=TX+(ti+.5)*dw;doc.line(x,top,x,y);doc.setLineWidth(.2)}};
 const wkShade=(yy,h)=>{days.forEach((x,i)=>{const w=pd(x).getDay();if(w==0||w==6){fill(C.wk);doc.rect(TX+i*dw,yy,dw,h,'F')}})};
 y=head(true);top=y;
 g.groups.forEach(gr=>{
  if(y+13+RH>H-34){endPage();doc.addPage();y=head(false);top=y}
  fill(C.hd);doc.rect(M,y,LW+TW,13,'F');ink(C.tx);doc.setFont('helvetica','bold');doc.setFontSize(8);doc.text(gr.s.n,M+3,y+9.5);doc.text(g.wavg(gr.rows,ef)+'%',TX-6,y+9.5,{align:'right'});y+=13;
  gr.rows.forEach(o=>{
   if(y+RH>H-34){endPage();doc.addPage();y=head(false);top=y}
   wkShade(y,RH);stroke(C.ln);doc.line(M,y+RH,M+LW+TW,y+RH);
   const eqn=nm(db.eq,o.eq)!='—'?nm(db.eq,o.eq):gr.s.n;
   ink(C.tx);doc.setFont('helvetica','bold');doc.setFontSize(7.5);doc.text(doc.splitTextToSize(o.folio+'  '+eqn,LW-50)[0],M+3,y+9);
   doc.setFont('helvetica','normal');doc.setFontSize(6.5);ink(C.mu);doc.text(doc.splitTextToSize(nm(db.tech,o.tech)+'  -  '+sit(o,g.t)[0],LW-50)[0],M+3,y+17);
   ink(C.tx);doc.setFontSize(8);doc.text(ef(o)+'%',TX-6,y+13,{align:'right'});
   const s=ost(o),len=dd(s,oen(o))+1,x0=TX+dd(GS,s)*dw,fw=len*dw,vx0=Math.max(x0,TX),vx1=Math.min(x0+fw,TX+TW),cp=o.tipo=='Correctivo'?C.c:C.p,cs=o.tipo=='Correctivo'?C.cs:C.ps;
   if(vx1>vx0){fill(cs);doc.rect(vx0,y+5,vx1-vx0,10,'F');const px1=Math.min(x0+fw*ef(o)/100,TX+TW);if(px1>vx0){fill(cp);doc.rect(vx0,y+5,px1-vx0,10,'F')}
    if(s<=g.t){const ex=x0+fw*esp(o,g.t)/100;if(ex>=vx0&&ex<=vx1){fill(C.tx);doc.rect(ex-.5,y+3,1,14,'F')}}
    ink(C.tx);doc.setFontSize(6.5);doc.text(ef(o)+'%',Math.min(vx1+3,TX+TW-16),y+12.5)}
   y+=RH})});
 endPage();
 const np=doc.getNumberOfPages();for(let i=1;i<=np;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8);ink(C.mu);doc.text('Página '+i+' de '+np,W-M,H-14,{align:'right'})}
 doc.save('cronograma_mantenimiento_'+g.t+'.pdf')}
const TABS=[['o','Órdenes',vO],['c','Cronograma',vC],['e','Equipos',vE],['t','Técnicos',vT],['p','Desempeño',vP],['s','Campos',vS]];
function render(){$('nav').innerHTML=TABS.map(t=>`<button class="${t[0]==TAB?'on':''}" onclick="TAB='${t[0]}';render()">${t[1]}</button>`).join('');$('app').innerHTML=TABS.find(t=>t[0]==TAB)[2]()}
boot();
</script></body></html>
